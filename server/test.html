<!DOCTYPE html>
<html>
<head>
    <title>Ratslap Test</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        button { margin: 5px; padding: 8px 16px; cursor: pointer; }
        #log { margin-top: 20px; border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: auto; }
        .event { margin: 4px 0; }
        .sent { color: blue; }
        .received { color: green; }
        .error { color: red; }
        .important { color: purple; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Ratslap Backend Test</h2>

    <div>
        <input id="nameInput" placeholder="Enter your name" />
        <button onclick="createRoom()">Create Room</button>
    </div>

    <div>
        <input id="roomCodeInput" placeholder="Room code" />
        <input id="joinNameInput" placeholder="Your name" />
        <button onclick="joinRoom()">Join Room</button>
    </div>

    <div>
        <button onclick="startGame()">Start Game</button>
        <button onclick="playCard()">Play Card</button>
        <button onclick="slap()">SLAP</button>
    </div>

    <div>
        <strong>Room:</strong> <span id="roomCode">none</span> |
        <strong>Players:</strong> <span id="playerCount">0</span> |
        <strong>Pile:</strong> <span id="pileInfo">empty</span> |
        <strong>Turn:</strong> <span id="currentTurn">-</span>
    </div>

    <div id="log"></div>

    <script src="https://cdn.socket.io/4.8.0/socket.io.min.js"></script>
    <script>
        const socket = io("http://localhost:3000");
        let currentRoomCode = null;

        const playerNames = {};

        function log(msg, type = "event") {
            const div = document.getElementById("log");
            const entry = document.createElement("div");
            entry.className = `event ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            div.appendChild(entry);
            div.scrollTop = div.scrollHeight;
        }

        socket.on("connect", () => log(`Connected: ${socket.id}`, "received"));
        socket.on("disconnect", () => log("Disconnected", "error"));

        socket.on("room-created", (room) => {
            currentRoomCode = room.id;
            document.getElementById("roomCode").textContent = room.id;
            document.getElementById("playerCount").textContent = room.players.length;

            room.players.forEach(p => playerNames[p.id] = p.name);

            log(`Room created: ${room.id}`, "received");
        });

        socket.on("room-updated", (room) => {
            document.getElementById("playerCount").textContent = room.players.length;

            room.players.forEach(p => playerNames[p.id] = p.name);

            log(`Room updated: ${room.players.length} players`, "received");
        });

        socket.on("game-started", (data) => {
            document.getElementById("currentTurn").textContent = data.currentPlayerId;
            document.getElementById("pileInfo").textContent = `${data.pile.size} cards`;

            data.players.forEach(p => playerNames[p.id] = p.name);

            log(`Game started! ${data.players.map(p => `${p.name}(${p.cardCount})`).join(", ")}`, "received");
        });
socket.on("card-played", (data) => {
    const card = data.playedCard || data.topCard || data.pile?.topCard || null;
    const playerName = playerNames[data.playerId] || data.playerId.slice(0, 6);

    if (!card) {
        console.error("card-played missing card payload:", data);
        log(`Received card-played event, but no card was provided`, "error");
        return;
    }

    document.getElementById("pileInfo").textContent =
        data.pile && data.pile.size > 0
            ? `${card.value} of ${card.suit} (${data.pile.size} cards)`
            : "empty";

    document.getElementById("currentTurn").textContent = data.currentPlayerId ?? "-";

    let msg = `${playerName} plays ${card.value} of ${card.suit}`;
    msg += ` | ${data.players.map(p => `${p.name}:${p.cardCount}`).join(", ")}`;
    log(msg, "received");

    if (data.pileWinnerName) {
        log(`🃏 ${data.pileWinnerName} takes the pile!`, "received");
    }
});

        socket.on("slap-result", (data) => {
            const slapperName = playerNames[data.playerId] || data.playerId.slice(0,6);
            const winnerName = playerNames[data.winnerId] || data.winnerId?.slice(0,6);

            if (data.valid) {
                log(`🖐 VALID SLAP by ${slapperName}! ${winnerName} wins the pile`, "received");
            } else {
                log(`INVALID SLAP by ${slapperName} — burned a card`, "error");
            }

            document.getElementById("pileInfo").textContent = `${data.pile.size} cards`;
        });

        socket.on("error", (msg) => log(`Error: ${msg}`, "error"));

        socket.on("game-over", (data) => {
            log(`🏆 GAME OVER — ${data.winnerName} wins! | ${data.players.map(p => `${p.name}:${p.cardCount}`).join(", ")}`, "important");

            const challengeInfo = document.getElementById("challengeInfo");
            if (challengeInfo) challengeInfo.textContent = "none";

            document.getElementById("currentTurn").textContent = "-";
            document.getElementById("pileInfo").textContent = "empty";
        });

        function createRoom() {
            const name = document.getElementById("nameInput").value || "Player1";
            socket.emit("create-room", name);
            log(`Creating room as ${name}`, "sent");
        }

        function joinRoom() {
            const code = document.getElementById("roomCodeInput").value;
            const name = document.getElementById("joinNameInput").value || "Player2";
            currentRoomCode = code;
            socket.emit("join-room", { roomCode: code, playerName: name });
            log(`Joining room ${code} as ${name}`, "sent");
        }

        function startGame() {
            socket.emit("start-game", currentRoomCode);
            log("Starting game", "sent");
        }

        function playCard() {
            socket.emit("play-card", currentRoomCode);
            log("Playing card", "sent");
        }

        function slap() {
            socket.emit("slap", currentRoomCode);
            log("SLAP!", "sent");
        }
    </script>
</body>
</html>
